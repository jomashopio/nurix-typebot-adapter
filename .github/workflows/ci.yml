name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Build adapter image
        run: docker build --tag nurix-adapter:check .
      - name: Build public gateway image
        run: >-
          docker build
          --file infra/app-platform/gateway/Dockerfile
          --tag nurix-gateway:check .
      - name: Validate public gateway configuration
        run: >-
          docker run --rm
          --env ADAPTER_UPSTREAM=http://adapter:3000
          --env GATEWAY_SHARED_SECRET=test-only-placeholder
          nurix-gateway:check
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
